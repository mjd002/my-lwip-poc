name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Cache MSYS2 pacman packages
        uses: actions/cache@v4
        with:
          path: |
            C:\tools\msys64\var\cache\pacman\pkg
          key: ${{ runner.os }}-msys2-pacman-${{ hashFiles('**/cwrap/build_lwip.ps1') }}
          restore-keys: |
            ${{ runner.os }}-msys2-pacman-

      - name: Cache WinLibs (optional)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\winlibs
          key: ${{ runner.os }}-winlibs-${{ hashFiles('**/cwrap/build_lwip.ps1') }}
          restore-keys: |
            ${{ runner.os }}-winlibs-
      - name: Set up MSYS2 and mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-winpthreads
            mingw-w64-x86_64-toolchain

      - name: Build lwIP DLL
        shell: pwsh
        run: |
          Set-Location -LiteralPath ${{ github.workspace }}
          # Ensure LOCALAPPDATA points to a writable location for msys/WinLibs lookups
          $env:LOCALAPPDATA = $env:LOCALAPPDATA
          .\cwrap\build_lwip.ps1
      - name: Run pytest
        run: |
          Set-Location -LiteralPath ${{ github.workspace }}
          python -m pip install -U pip pytest
          python -m pytest -q tests/test_lwip_extended_ctypes.py -q