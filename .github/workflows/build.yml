name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Cache MSYS2 pacman packages
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\msys2-64\var\cache\pacman\pkg
          key: ${{ runner.os }}-msys2-pacman-${{ hashFiles('**/cwrap/build_lwip.ps1') }}
          restore-keys: |
            ${{ runner.os }}-msys2-pacman-

      - name: Cache WinLibs (optional)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\winlibs
          key: ${{ runner.os }}-winlibs-${{ hashFiles('**/cwrap/build_lwip.ps1') }}
          restore-keys: |
            ${{ runner.os }}-winlibs-
      - name: Install MSYS2 and mingw-w64
        shell: pwsh
        run: |
          # Install MSYS2 from the official Chocolatey package (fast on GH-hosted runners)
          choco install msys2 -y
          # Initialize MSYS2 environment and update packages
          $msys = "${env:ProgramFiles}\msys2-64"
          $pacman = Join-Path $msys 'usr\bin\bash.exe'
          & $pacman -lc "pacman -Syu --noconfirm" || true
          # Install mingw-w64 toolchain packages (gcc, make)
          & $pacman -lc "pacman -S --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-crt-git mingw-w64-x86_64-winpthreads mingw-w64-x86_64-toolchain"
          # Add mingw64 bin to PATH for subsequent steps
          $mingw64 = Join-Path $msys 'mingw64\bin'
          Write-Host "Adding mingw to PATH: $mingw64"
          echo "##[add-path]$mingw64"
          $env:PATH = "$mingw64;$env:PATH"

      - name: Build lwIP DLL
        shell: pwsh
        run: |
          Set-Location -LiteralPath ${{ github.workspace }}
          # Ensure LOCALAPPDATA points to a writable location for msys/WinLibs lookups
          $env:LOCALAPPDATA = $env:LOCALAPPDATA
          .\cwrap\build_lwip.ps1
      - name: Run pytest
        run: |
          Set-Location -LiteralPath ${{ github.workspace }}
          python -m pip install -U pip pytest
          python -m pytest -q tests/test_lwip_extended_ctypes.py -q